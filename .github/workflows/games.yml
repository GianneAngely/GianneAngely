name: Update games

on:
  schedule:
    # 03:40 UTC daily, after the collaborations job.
    - cron: "40 3 * * *"
  workflow_dispatch:

# Never let two runs fight over the same commit.
concurrency:
  group: games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        # Takes the first frame of each itch cover. Usually already on the runner.
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Rebuild game cards from the itch.io feed
        run: node scripts/build-games.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "GianneAngely"
          git config user.email "168960346+GianneAngely@users.noreply.github.com"
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update games"
          git push
